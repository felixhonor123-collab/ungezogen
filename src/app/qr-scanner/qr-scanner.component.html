<div class="scanner-overlay" (click)="close()">
  <div class="scanner-sheet" (click)="$event.stopPropagation()">
    <div class="scanner-header">
      <span class="scanner-title">QR-Code scannen</span>
      <button class="scanner-close" type="button" (click)="close()" aria-label="Schließen">&#x2715;</button>
    </div>

    @if (!useFileInput) {
      <div class="scanner-viewport">
        <video #video class="scanner-video" autoplay muted playsinline></video>
        <canvas #canvas class="scanner-canvas" style="display:none"></canvas>
        <div class="scanner-frame">
          <span class="scanner-corner tl"></span>
          <span class="scanner-corner tr"></span>
          <span class="scanner-corner bl"></span>
          <span class="scanner-corner br"></span>
        </div>
        <div class="scanner-line"></div>
      </div>
    }

    @if (useFileInput) {
      <div class="scanner-file-area">
        <p class="scanner-file-hint">Auf diesem Gerät wird die Kamera nicht direkt unterstützt. Bitte ein Foto des QR-Codes auswählen.</p>
        <button class="btn-primary scanner-file-btn" type="button" (click)="fileInputRef.nativeElement.click()">
          Foto auswählen
        </button>
      </div>
    }

    <input
      #fileInput
      type="file"
      accept="image/*"
      capture="environment"
      style="display:none"
      (change)="onFileSelected($event)"
    />

    @if (error()) {
      <p class="scanner-error">{{ error() }}</p>
    }
  </div>
</div>
